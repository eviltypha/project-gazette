[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazette"
version = "0.1.0"
description = "Citation-first Q&A over synthetic RBI-style KYC/AML circulars"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
openai = ["openai>=1.30"]

[tool.setuptools.packages.find]
include = ["gazette*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: needs network or API keys; excluded by default (run with -m live)",
]
